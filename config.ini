# filmiq configuration
# All tunable parameters live here. Agent code reads from this file.

[models]
orchestrator = gemini-2.5-flash
sub_agents = gemini-2.5-flash-lite
ranking_agent = gemini-2.5-flash

[thresholds]
# Score at or above this routes to human review queue
human_gate = 65
# Dimensions scoring at or below this count as low-confidence signals
low_confidence_dimension_floor = 4
# Two or more dimensions below the floor triggers the low-confidence flag
low_confidence_count_trigger = 2
# Score variance across runs above this triggers a consistency flag
consistency_variance_limit = 1

[cpm_rates]
# Illustrative placeholder rates so the repo runs on a clean clone.
# Real rates come from internal methodology and are withheld here.
# These are not client figures, and no ROI output in this repo is a
# real projection. Only three values affect the formula: theatrical,
# streaming, and the mean of the social rates below.
theatrical_cpm = 35.0
streaming_cpm = 35.0
social_cpm_instagram_feed = 35.0
social_cpm_instagram_story = 35.0
social_cpm_twitter = 35.0
social_cpm_facebook = 35.0
social_cpm_youtube = 35.0
social_cpm_tiktok = 35.0

[tier_multipliers]
# Four-tier quality rating per proprietary methodology.
fair = 0.75
good = 1.0
great = 1.5
excellent = 2.0

[paths]
slate = data/slate.json
brand_profile = data/brand_profile.json
skill = skills/film-partnership-scoring-rubric.md
scores_output = outputs/scores.json
